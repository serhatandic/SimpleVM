name: SimpleVM

options:
  bundleIdPrefix: com.simplevm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  SimpleVMCore:
    path: Packages/SimpleVMCore
  CocoaSpice:
    path: Packages/CocoaSpice

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SimpleVM:
    type: application
    platform: macOS
    sources:
      - path: SimpleVMApp
      - path: Resources
      - path: GuestTools
        type: folder
        buildPhase: resources
    dependencies:
      - package: SimpleVMCore
      - target: UTMQEMULauncher
      - target: UTMQEMUARM64Launcher
      - target: UTMSWTPMLauncher
      - package: CocoaSpice
        product: CocoaSpiceNoUsb
      - framework: /Applications/UTM.app/Contents/Frameworks/glib-2.0.0.framework
      - framework: /Applications/UTM.app/Contents/Frameworks/gobject-2.0.0.framework
      - framework: /Applications/UTM.app/Contents/Frameworks/gio-2.0.0.framework
      - framework: /Applications/UTM.app/Contents/Frameworks/gmodule-2.0.0.framework
      - framework: /Applications/UTM.app/Contents/Frameworks/gstreamer-1.0.0.framework
      - framework: /Applications/UTM.app/Contents/Frameworks/spice-client-glib-2.0.8.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplevm.app
        PRODUCT_NAME: SimpleVM
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SimpleVM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Serhat Andic. All rights reserved."
        CODE_SIGN_ENTITLEMENTS: Config/SimpleVM.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "/Applications/UTM.app/Contents/Frameworks"
    postBuildScripts:
      - name: Embed UTM runtime helpers
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/UTMQEMULauncher"
          - "$(BUILT_PRODUCTS_DIR)/UTMQEMUARM64Launcher"
          - "$(BUILT_PRODUCTS_DIR)/UTMSWTPMLauncher"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/UTMQEMULauncher"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/UTMQEMUARM64Launcher"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/UTMSWTPMLauncher"
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/UTMQEMULauncher" \
            "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/UTMQEMULauncher"
          cp "$BUILT_PRODUCTS_DIR/UTMQEMUARM64Launcher" \
            "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/UTMQEMUARM64Launcher"
          cp "$BUILT_PRODUCTS_DIR/UTMSWTPMLauncher" \
            "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/UTMSWTPMLauncher"

  UTMQEMULauncher:
    type: tool
    platform: macOS
    sources:
      - path: Tools/UTMQEMULauncher
    dependencies:
      - framework: /Applications/UTM.app/Contents/Frameworks/qemu-x86_64-softmmu.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplevm.utm-qemu-launcher
        PRODUCT_NAME: UTMQEMULauncher
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Config/UTMQEMULauncher.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "/Applications/UTM.app/Contents/Frameworks"

  UTMQEMUARM64Launcher:
    type: tool
    platform: macOS
    sources:
      - path: Tools/UTMQEMUARM64Launcher
    dependencies:
      - framework: /Applications/UTM.app/Contents/Frameworks/qemu-aarch64-softmmu.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplevm.utm-qemu-arm64-launcher
        PRODUCT_NAME: UTMQEMUARM64Launcher
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Config/UTMQEMUARM64Launcher.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "/Applications/UTM.app/Contents/Frameworks"

  UTMSWTPMLauncher:
    type: tool
    platform: macOS
    sources:
      - path: Tools/UTMSWTPMLauncher
    dependencies:
      - framework: /Applications/UTM.app/Contents/Frameworks/swtpm.0.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplevm.utm-swtpm-launcher
        PRODUCT_NAME: UTMSWTPMLauncher
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Config/UTMSWTPMLauncher.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "/Applications/UTM.app/Contents/Frameworks"

  SimpleVMAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SimpleVMAppTests
    dependencies:
      - target: SimpleVM
      - package: SimpleVMCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplevm.app-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SimpleVM.app/Contents/MacOS/SimpleVM"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SimpleVMUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SimpleVMUITests
    dependencies:
      - target: SimpleVM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplevm.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: SimpleVM

schemes:
  SimpleVM:
    build:
      targets:
        SimpleVM: all
        SimpleVMAppTests: [test]
        SimpleVMUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - SimpleVMAppTests
        - SimpleVMUITests
